server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: any path that isn't a real static file falls back
    # to index.html so client-side navigation doesn't 404 on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
