[project]
name = "jobseek"
version = "0.1.0"
description = "AI-powered job application assistant with evidence-grounded generation"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.38",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "anthropic>=0.34",
    "pypdf>=4.3",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["backend", "backend.models", "backend.schemas", "backend.services",
    "backend.services.documents", "backend.services.evidence",
    "backend.providers", "backend.providers.llm"]
