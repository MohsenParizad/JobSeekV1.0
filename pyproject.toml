[project]
name = "jobseek"
version = "0.1.0"
description = "AI-powered job application assistant with evidence-grounded generation"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "anthropic>=0.34",
    "pypdf>=4.3",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
]
# The Streamlit UI (app/streamlit_app.py) is optional — nothing under
# backend/ imports it, and the backend Docker image deliberately doesn't
# install it (it pulls in a large dependency tree the API doesn't need).
streamlit = [
    "streamlit>=1.38",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",   # function-call-in-default-argument: FastAPI's Depends()/Query() pattern relies on this
    "UP042",  # replace-str-enum: models intentionally use `class X(str, Enum)` (see backend/models/evidence.py)
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["backend", "backend.models", "backend.schemas", "backend.services",
    "backend.services.documents", "backend.services.evidence", "backend.services.jobs",
    "backend.services.matching", "backend.services.generation",
    "backend.providers", "backend.providers.llm", "backend.providers.jobs",
    "backend.api", "backend.api.routers"]
